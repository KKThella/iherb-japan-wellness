  const { useState, useEffect, useRef, useContext, createContext, Children } = React;

  // ── Minimal router ─────────────────────────────────────────────
  const RouterCtx = createContext(null);
  function MemoryRouter({ children }) {
    const [loc, setLoc] = useState({ pathname:"/", state:null });
    const navigate = (path, opts={}) => setLoc({ pathname:path, state:opts.state??null });
    return <RouterCtx.Provider value={{ loc, navigate }}>{children}</RouterCtx.Provider>;
  }
  function useNavigate() { return useContext(RouterCtx).navigate; }
  function useLocation() { return useContext(RouterCtx).loc; }
  function Routes({ children }) {
    const { loc } = useContext(RouterCtx);
    const arr = Children.toArray(children);
    const match = arr.find(c => c.props.path === loc.pathname) || arr.find(c => c.props.path === "*");
    return match ? match.props.element : null;
  }
  function Route() { return null; }

  // ── Language context ───────────────────────────────────────────
  const LangCtx = createContext({ bilingual: true });
  const useLang = () => useContext(LangCtx);
  // Wraps Japanese text — renders nothing when EN-only mode
  const JA = ({ children }) => {
    const { bilingual } = useLang();
    return bilingual ? <>{children}</> : null;
  };

  // ═══════════════════════════════════════════════════════════════
  //  API LAYER
  // ═══════════════════════════════════════════════════════════════
  async function callClaude(apiKey, system, messages, maxTokens=900) {
    const payload = JSON.stringify({ model:MODEL, max_tokens:maxTokens, system, messages });

    // On Netlify: route through server-side proxy — API key never touches the browser
    if (USE_PROXY) {
      const res = await fetch(PROXY_URL, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: payload,
      });
      if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.error?.message||`API ${res.status}`); }
      return (await res.json()).content[0].text;
    }

    // Local / GitHub Pages: use key entered by user
    const res = await fetch(API_URL, {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "x-api-key": apiKey,
        "anthropic-version":"2023-06-01",
        "anthropic-dangerous-direct-browser-access":"true",
      },
      body: payload,
    });
    if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.error?.message||`API ${res.status}`); }
    return (await res.json()).content[0].text;
  }

  async function fetchJapanStarterSet(apiKey, goals, diet) {
    const system = `You are an iHerb Japan personalization engine. Pick exactly 3 products from the catalog for a new Japanese customer. Return ONLY valid JSON, no markdown.

CATALOG:\n${CATALOG_TEXT}

FORMAT:
{
  "picks":["id1","id2","id3"],
  "reasons":["1-sentence reason per product tied to this user","...","..."],
  "strategies":["content-based","collaborative","hybrid"],
  "match_scores":[95,88,82],
  "synergy_en":"One sentence how these 3 work together.",
  "synergy_ja":"日本語1文：この3製品がどう連携するか。"
}
Rules: only catalog IDs; respect diet (vegan/vegetarian: no fish oil; halal: no pork gelatin); scores 72–98.`;
    const raw = await callClaude(apiKey, system, [{role:"user",content:`Goals: ${goals.join(", ")}. Diet: ${diet}.`}], 600);
    return JSON.parse(raw.replace(/```json|```/g,"").trim());
  }

  async function fetchConversationalReply(apiKey, messages, bilingual = true) {
    const langRule = bilingual
      ? "You may naturally mix English and Japanese phrases in your replies."
      : "IMPORTANT: Respond in English only. Do not use any Japanese characters or text whatsoever.";
    const system = `You are a warm wellness guide for iHerb Japan. Help customers find supplements through conversation. ${langRule}

Rules: ask ONE question per turn; after 2–3 exchanges recommend 3 products; never diagnose or prescribe; be concise.

CATALOG:\n${CATALOG_TEXT}

Respond with valid JSON only:
{ "reply":"your message", "recs":null, "followUp":"next question or null" }

When recommending: "recs":[{"id":"catalog-id","matchScore":87,"reason":"1 sentence","tag":"label"}]`;
    const raw = await callClaude(apiKey, system, messages, 800);
    try { return JSON.parse(raw.replace(/```json|```/g,"").trim()); }
    catch { return { reply:raw, recs:null, followUp:null }; }
  }

  async function fetchProfileRecs(apiKey, profile) {
    const system = `You are an iHerb Japan recommendation engine. Return ONLY valid JSON, no markdown.
CATALOG:\n${CATALOG_TEXT}
Return 4 recs: {"recs":[{"id":"catalog-id","matchScore":88,"reason":"1 sentence","strategy":"content-based|collaborative|hybrid","confidence":85}]}`;
    const raw = await callClaude(apiKey, system, [{role:"user",content:`Age:${profile.age||"?"}, goals:${profile.goals}, diet:${profile.diet}, notes:${profile.notes||"none"}.`}], 700);
    return JSON.parse(raw.replace(/```json|```/g,"").trim());
  }

  async function fetchAskAnything(apiKey, query, context, bilingual = true) {
    const langRule = bilingual ? "" : " Respond in English only.";
    const system = `You are a knowledgeable iHerb Japan wellness advisor. Answer in 2–4 sentences. Reference products when helpful. Never diagnose.${langRule} Context: ${context||"general wellness"}.`;
    return callClaude(apiKey, system, [{role:"user",content:query}], 350);
  }

              />
              <button onClick={saveKey}

              >Save Key</button>
              {!apiKey && <p className="text-xs text-amber-600 text-center mt-1.5">⚠ Demo mode</p>}
            </div>
          )}
        </div>}

    );
  }

          </div>

          <div className="bg-gradient-to-br from-primary to-primary-dark rounded-3xl p-5 text-white">
            <div className="flex items-center gap-2 mb-2">
              <span className="material-symbols-outlined icon-filled text-white/80" style={{ fontSize:18 }}>hub</span>
              <p className="font-bold text-sm">Stack Synergy</p>
              <JA><span className="font-heading text-xs text-white/60">スタックの相乗効果</span></JA>
            </div>
            <p className="text-sm text-white/90 leading-relaxed">Collagen builds skin structure, probiotics maximize absorption, magnesium supports overnight recovery — a complete daily system.</p>
          </div>

          <div className="bg-white rounded-2xl shadow-card px-4 py-3 flex items-center gap-3 border border-green-100">
            <span className="material-symbols-outlined icon-filled text-primary" style={{ fontSize:20 }}>verified</span>
            <p className="text-xs text-text-main font-semibold">Trusted by 100M+ customers · Ships to Japan</p>
          </div>
        </div>
      </div>
    );

  // ═══════════════════════════════════════════════════════════════
  //  SCREEN 2 — INTAKE  (web: wider, 4-col goal grid)
  // ═══════════════════════════════════════════════════════════════
  function IntakeScreen() {
    const navigate = useNavigate();
    const [step,  setStep]  = useState(1);
    const [goals, setGoals] = useState([]);
    const [diet,  setDiet]  = useState("no-restriction");

    const toggleGoal = id =>
      setGoals(prev => prev.includes(id) ? prev.filter(g=>g!==id) : prev.length<3 ? [...prev,id] : prev);

    const next = () => {
      if (step===1 && goals.length>0) setStep(2);
      else if (step===2) navigate("/thinking", { state:{ goals, diet } });
    };

    return (
      <div className="min-h-screen flex items-center justify-center px-8 py-10">
        <div className="w-full max-w-2xl">

          {/* Progress */}
          <div className="flex items-center gap-4 mb-8">
            <button onClick={() => step===1 ? navigate("/") : setStep(1)} className="text-muted hover:text-text-main transition-colors">
              <span className="material-symbols-outlined" style={{ fontSize:22 }}>arrow_back</span>
            </button>
            <div className="flex-1 flex gap-2">
              {[1,2].map(s => (
                <div key={s} className={`flex-1 h-1.5 rounded-full transition-all duration-500 ${s<=step?"bg-primary":"bg-green-100"}`} />
              ))}
            </div>
            <span className="text-sm font-bold text-muted">{step} of 2</span>
          </div>

          {step===1 ? (
            <div className="anim-up">
              <h2 className="font-display font-bold text-3xl text-text-main mb-1">What are your health goals?</h2>
              <JA><p className="font-heading text-base text-muted mb-6">健康目標を選んでください（最大3つ）</p></JA>
              {!<></> && <div className="mb-6" />}

              {/* 4-column grid on web */}
              <div className="grid grid-cols-4 gap-3 mb-6">
                {GOAL_OPTIONS.map((g,i) => {
                  const sel = goals.includes(g.id);
                  return (
                    <button key={g.id} onClick={() => toggleGoal(g.id)}
                      className={`goal-card relative p-4 rounded-2xl text-center border-2 transition-all ${
                        sel ? "border-primary bg-primary-light shadow-soft" : "border-transparent bg-white shadow-card hover:border-green-200"
                      }`}
                    >
                      <span className={`material-symbols-outlined ${sel?"icon-filled text-primary":"text-muted"}`} style={{ fontSize:28 }}>{g.icon}</span>
                      <p className={`font-bold text-sm mt-1.5 ${sel?"text-primary":"text-text-main"}`}>{g.label}</p>
                      <JA><p className="font-heading text-xs text-muted mt-0.5">{g.ja}</p></JA>
                      {sel && (
                        <div className="absolute top-2 right-2 w-5 h-5 bg-primary rounded-full flex items-center justify-center anim-check">
                          <span className="material-symbols-outlined icon-filled text-white" style={{ fontSize:13 }}>check</span>
                        </div>
                      )}
                    </button>
                  );
                })}
              </div>

              <p className="text-sm text-muted text-center">{goals.length}/3 selected · {3-goals.length} more allowed</p>
            </div>
          ) : (
            <div className="anim-up">
              <h2 className="font-display font-bold text-3xl text-text-main mb-1">Any dietary needs?</h2>
              <JA><p className="font-heading text-base text-muted mb-6">食事制限はありますか？</p></JA>

              {/* Horizontal diet options on web */}
              <div className="grid grid-cols-2 gap-3 mb-8">
                {DIET_OPTIONS.map(d => (
                  <button key={d.id} onClick={() => setDiet(d.id)}
                    className={`p-4 rounded-2xl text-left border-2 flex items-center justify-between transition-all ${
                      diet===d.id ? "border-primary bg-primary-light" : "border-transparent bg-white shadow-card hover:border-green-200"
                    }`}
                  >
                    <div>
                      <p className={`font-bold text-base ${diet===d.id?"text-primary":"text-text-main"}`}>{d.label}</p>
                      <JA><p className="font-heading text-sm text-muted">{d.ja}</p></JA>
                    </div>
                    {diet===d.id && (
                      <span className="material-symbols-outlined icon-filled text-primary" style={{ fontSize:24 }}>check_circle</span>
                    )}
                  </button>
                ))}
              </div>
            </div>
          )}

          <button onClick={next} disabled={step===1 && goals.length===0}
            className={`w-full py-4 rounded-2xl font-bold text-lg transition-all active:scale-95 ${
              step===2||goals.length>0 ? "bg-primary text-white shadow-soft hover:bg-primary-dark" : "bg-green-100 text-muted cursor-not-allowed"
            }`}
          >
            {step===1 ? "Continue →" : "Build My Wellness Plan"}
            <JA>
              <span className="block font-heading font-normal text-sm opacity-75 mt-0.5">
                {step===1 ? "次へ" : "プランを作成する"}
              </span>
            </JA>
          </button>
        </div>
      </div>
    );
  }

  // ═══════════════════════════════════════════════════════════════
  //  SCREEN 3 — THINKING
  // ═══════════════════════════════════════════════════════════════
  function ThinkingScreen({ apiKey }) {
    const navigate = useNavigate();
    const { state }            = useLocation();
    const { goals=[], diet="no-restriction" } = state||{};
    const [step,  setStep]  = useState(0);
    const [error, setError] = useState("");
    const fired = useRef(false);

    const STEPS = [
      { en:"Analyzing your wellness goals...",          ja:"健康目標を分析中...",           icon:"analytics" },
      { en:"Matching Japan catalog to your needs...",   ja:"カタログから商品を照合中...",    icon:"inventory_2" },
      { en:"Optimizing your personal stack...",          ja:"スタックを最適化中...",          icon:"auto_awesome" },
    ];

    const MOCK = {
      picks:["collagen-up","probiotic","magnesium"],
      reasons:[
        "Marine collagen is Japan's #1 beauty supplement — directly targets your skin & beauty goals.",
        "A 25-billion CFU probiotic supports gut health and improves collagen absorption.",
        "High-absorption magnesium reduces cortisol and supports deep sleep recovery.",
      ],
      strategies:["content-based","collaborative","hybrid"],
      match_scores:[96,91,85],
      synergy_en:"This trio works as a system: collagen rebuilds skin, probiotics maximize its absorption, and magnesium reduces cortisol for overnight repair.",
      synergy_ja:"このトリオはシステムとして機能します：コラーゲンが肌を再建し、プロバイオティクスがその吸収を最大化し、マグネシウムがコルチゾールを下げて夜間の修復を促進します。",
    };

    useEffect(() => {
      if (fired.current) return;
      fired.current = true;
      (async () => {
        try {
          setStep(0); await new Promise(r=>setTimeout(r,900));
          setStep(1);
          const result = apiKey
            ? await fetchJapanStarterSet(apiKey, goals, diet)
            : (await new Promise(r=>setTimeout(r,1400)), MOCK);
          setStep(2); await new Promise(r=>setTimeout(r,600));
          navigate("/results", { state:{ result, goals, diet } });
        } catch(e) { setError(e.message||"Something went wrong."); }
      })();
    }, []);

    if (error) return (
      <div className="min-h-screen flex flex-col items-center justify-center px-6 anim-up">
        <span className="material-symbols-outlined text-accent mb-3" style={{ fontSize:52 }}>error_outline</span>
        <h2 className="font-display font-bold text-xl text-text-main mb-2">Something went wrong</h2>
        <p className="text-sm text-muted mb-6 text-center max-w-sm">{error}</p>
        <button onClick={() => navigate("/intake")} className="bg-primary text-white px-8 py-3 rounded-2xl font-bold shadow-soft hover:bg-primary-dark">Try Again</button>
      </div>
    );

    return (
      <div className="min-h-screen flex items-center justify-center">
        <div className="w-full max-w-md px-6">
          <div className="relative mx-auto w-28 h-28 mb-10 flex items-center justify-center">
            <div className="absolute inset-0 rounded-full bg-primary/10" style={{ animation:"pulse-ring 1.6s ease-out infinite" }} />
            <div className="absolute inset-3 rounded-full bg-primary/08" style={{ animation:"pulse-ring 1.6s ease-out infinite",animationDelay:".4s" }} />
            <div className="relative w-20 h-20 bg-gradient-to-br from-primary to-primary-dark rounded-full flex items-center justify-center shadow-soft">
              <span className="material-symbols-outlined icon-filled text-white" style={{ fontSize:36 }}>psychology</span>
            </div>
          </div>

          <div className="space-y-3 mb-8">
            {STEPS.map((s,i) => {
              const done=i<step, active=i===step;
              return (
                <div key={i} className={`flex items-center gap-4 p-4 rounded-2xl transition-all duration-500 ${
                  active?"bg-white shadow-soft":done?"bg-primary-light":"bg-green-50/60"
                }`}>
                  <div className={`w-11 h-11 rounded-full flex items-center justify-center shrink-0 transition-all ${
                    done?"bg-primary":active?"bg-primary/10":"bg-green-100"
                  }`}>
                    {done
                      ? <span className="material-symbols-outlined icon-filled text-white anim-check" style={{ fontSize:22 }}>check</span>
                      : active
                        ? <div style={{ width:18,height:18,border:"2px solid #438F4D",borderTopColor:"transparent",borderRadius:"50%",animation:"spin .8s linear infinite" }} />
                        : <span className="material-symbols-outlined text-muted" style={{ fontSize:22 }}>{s.icon}</span>
                    }
                  </div>
                  <div>
                    <p className={`font-bold text-base ${active?"text-text-main":done?"text-primary":"text-muted"}`}>{s.en}</p>
                    <JA><p className={`font-heading text-sm ${active?"text-muted":done?"text-primary/60":"text-muted/50"}`}>{s.ja}</p></JA>
                  </div>
                </div>
              );
            })}
          </div>

          <p className="text-center text-sm text-muted">
            Powered by Claude AI · <JA><span className="font-heading">AIが最適な組み合わせを選んでいます</span></JA>
          </p>
        </div>
      </div>
    );
  }

  // ═══════════════════════════════════════════════════════════════
  //  SCREEN 4 — RESULTS  (3-col grid · Ask Anything at top)
  // ═══════════════════════════════════════════════════════════════
  function ResultsScreen({ apiKey, addToList, added }) {
    const navigate        = useNavigate();
    const { state }       = useLocation();
    const { bilingual }   = useLang();
    const { result, goals=[], diet="" } = state||{};
    const [askQ,      setAskQ]      = useState("");
    const [askA,      setAskA]      = useState("");
    const [askLoading,setAskLoading]= useState(false);
    const [algoOpen,  setAlgoOpen]  = useState(false);

    if (!result) return (
      <div className="min-h-screen flex flex-col items-center justify-center gap-4">
        <p className="text-muted">No results yet — complete the quiz first.</p>
        <button onClick={() => navigate("/")} className="bg-primary text-white px-6 py-3 rounded-2xl font-bold shadow-soft">Start Quiz</button>
      </div>
    );

    const products = result.picks.map((id,i) => {
      const p = JAPAN_CATALOG.find(c=>c.id===id);
      return p ? { ...p, reason:result.reasons[i], strategy:result.strategies[i], matchScore:result.match_scores[i] } : null;
    }).filter(Boolean);

    const noResults     = products.length === 0;
    const lowConfidence = !noResults && products.every(p => p.matchScore < 72);

    const handleAsk = async () => {
      if (!askQ.trim()) return;
      setAskLoading(true); setAskA("");
      try {
        const ctx = `User goals: ${goals.join(", ")}. Stack: ${products.map(p=>p.name).join(", ")}.`;
        setAskA(apiKey ? await fetchAskAnything(apiKey,askQ,ctx,bilingual) : "Add your Anthropic API key to enable AI answers.");
      } catch { setAskA("Sorry — something went wrong."); }
      finally { setAskLoading(false); }
    };

    return (
      <div className="min-h-screen pb-16">

        {/* Hero banner */}
        <div className="bg-gradient-to-br from-primary to-primary-dark px-10 pt-10 pb-16 text-white">
          <div className="max-w-5xl mx-auto flex items-center justify-between">
            <div>
              <div className="flex items-center gap-3 mb-2">
                <div className="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center">
                  <span className="material-symbols-outlined icon-filled text-white" style={{ fontSize:22 }}>auto_awesome</span>
                </div>
                <div>
                  <h2 className="font-display font-bold text-2xl">Your Wellness Stack</h2>
                  <JA><p className="font-heading text-sm text-white/70">あなたのウェルネススタック</p></JA>
                </div>
              </div>
              <div className="flex flex-wrap gap-2 mt-3">
                {goals.map(g => {
                  const opt = GOAL_OPTIONS.find(o=>o.id===g);
                  return opt ? (
                    <span key={g} className="bg-white/20 text-white text-xs px-3 py-1 rounded-full font-semibold">
                      {opt.label} <JA><span className="font-heading opacity-80">· {opt.ja}</span></JA>
                    </span>
                  ) : null;
                })}
              </div>
            </div>
            <div className="flex gap-3 shrink-0">
              <button onClick={() => navigate("/")} className="border-2 border-white/40 text-white font-bold px-5 py-2.5 rounded-xl hover:bg-white/10 transition-all text-sm">
                Start Over
              </button>
              <button className="bg-white text-primary font-bold px-5 py-2.5 rounded-xl hover:bg-green-50 transition-all text-sm shadow-soft">
                Add to Cart →
              </button>
            </div>
          </div>
        </div>

        <div className="max-w-5xl mx-auto px-6 -mt-10 space-y-6">

          {/* ── Failure: no results ── */}
          {noResults && (
            <div className="bg-white rounded-3xl shadow-soft p-8 text-center anim-up">
              <span className="material-symbols-outlined text-muted mb-3" style={{ fontSize:48 }}>search_off</span>
              <h3 className="font-display font-bold text-text-main text-xl mb-2">No strong matches found</h3>
              <p className="text-sm text-muted mb-5 max-w-sm mx-auto">We couldn't find products that confidently match this combination of goals and dietary needs in our Japan catalog. Try broadening your goals or selecting "No restrictions" for diet.</p>
              <div className="flex gap-3 justify-center">
                <button onClick={() => navigate("/intake")} className="bg-primary text-white font-bold px-6 py-3 rounded-2xl text-sm shadow-soft hover:bg-primary-dark transition-all">Adjust Goals</button>
                <button onClick={() => navigate("/chat")} className="border-2 border-primary text-primary font-bold px-6 py-3 rounded-2xl text-sm hover:bg-primary-light transition-all">Try Chat Instead</button>
              </div>
            </div>
          )}

          {/* ── Warning: low confidence ── */}
          {lowConfidence && (
            <div className="bg-amber-50 border border-amber-200 rounded-2xl px-5 py-3 flex items-start gap-3 anim-up">
              <span className="material-symbols-outlined text-amber-500 shrink-0 mt-0.5" style={{ fontSize:20 }}>warning</span>
              <div>
                <p className="text-sm font-bold text-amber-800">Limited data — best-guess recommendations</p>
                <p className="text-xs text-amber-700 mt-0.5">Match scores are below our confidence threshold. These picks align with your stated goals but lack behavioral signal to validate them. Scores improve as more Japan users with similar profiles build history.</p>
              </div>
            </div>
          )}

          {/* ① 3-column product cards */}
          {!noResults && <div className="grid grid-cols-3 gap-4">
            {products.map((p,i) => (
              <div key={p.id} className="bg-white rounded-3xl shadow-soft p-5 anim-up" style={{ animationDelay:`${i*.1}s` }}>
                <div className="flex items-start justify-between gap-2 mb-3">
                  <div className="w-12 h-12 rounded-2xl flex items-center justify-center shrink-0" style={{ background:p.bg }}>
                    <span className="material-symbols-outlined icon-filled text-primary" style={{ fontSize:24 }}>{p.icon}</span>
                  </div>
                  {/* Score ring */}
                  <div className="text-center shrink-0">
                    <div className="relative w-14 h-14">
                      <svg width="56" height="56" viewBox="0 0 56 56">
                        <circle cx="28" cy="28" r="23" fill="none" stroke="#E8F5E9" strokeWidth="4"/>
                        <circle cx="28" cy="28" r="23" fill="none" stroke="#438F4D" strokeWidth="4"
                          strokeDasharray={`${(p.matchScore/100)*144.5} 144.5`} strokeLinecap="round" className="score-ring"/>
                      </svg>
                      <div className="absolute inset-0 flex items-center justify-center">
                        <span className="text-primary font-black text-sm">{p.matchScore}%</span>
                      </div>
                    </div>
                  </div>
                </div>
                <p className="text-xs text-muted font-bold uppercase tracking-wide">{p.brand}</p>
                <p className="font-bold text-sm text-text-main leading-snug mt-0.5">{p.name}</p>
                <p className="text-primary font-bold text-base mt-1">{p.price}</p>
                <p className="text-xs text-muted leading-relaxed mt-2">{p.reason}</p>
                <div className="flex gap-1.5 mt-3 flex-wrap">
                  <span className="bg-green-50 text-primary text-xs px-2 py-1 rounded-full border border-green-100 font-medium">{p.tag}</span>
                  <span className="bg-blue-50 text-blue-600 text-xs px-2 py-1 rounded-full border border-blue-100">{STRATEGY_LABEL[p.strategy]||p.strategy}</span>
                </div>
                <button onClick={() => addToList(p)}
                  className={`w-full mt-3 py-1.5 rounded-xl text-xs font-bold transition-all ${added[p.id]?"bg-primary text-white":"border border-primary text-primary hover:bg-primary-light"}`}
                >{added[p.id] ? "✓ Added to List" : "+ Add to List"}</button>
              </div>
            ))}
          </div>}

          {/* ② Ask Anything — moved above fold */}
          <div className="bg-white rounded-3xl shadow-soft p-6 anim-up" style={{ animationDelay:".3s" }}>
            <div className="flex items-center gap-2 mb-4">
              <span className="material-symbols-outlined icon-filled text-primary" style={{ fontSize:22 }}>chat</span>
              <h3 className="font-display font-bold text-text-main text-lg">Ask Anything About Your Stack</h3>
              <JA><span className="font-heading text-sm text-muted">· スタックについて何でも聞く</span></JA>
            </div>
            <div className="flex gap-3 mb-3">
              <input value={askQ} onChange={e=>setAskQ(e.target.value)}
                onKeyDown={e=>e.key==="Enter"&&handleAsk()}
                placeholder={`Ask about your stack... `}
                className="flex-1 border border-green-200 rounded-xl px-4 py-3 text-sm focus:border-primary transition-colors"
              />
              <button onClick={handleAsk} disabled={askLoading||!askQ.trim()}
                className="bg-primary text-white px-6 py-3 rounded-xl font-bold text-sm disabled:opacity-50 hover:bg-primary-dark active:scale-95 transition-all"
              >
                {askLoading ? <span className="spinner" /> : "Ask →"}
              </button>
            </div>
            {!askA && (
              <div className="flex flex-wrap gap-2">
                {["Can I take all 3 together?","Best time to take each?","Any side effects?","How long until I see results?"].map(q => (
                  <button key={q} onClick={() => setAskQ(q)}
                    className="text-xs bg-green-50 text-primary px-3 py-1.5 rounded-full hover:bg-primary-light border border-green-100 transition-colors"
                  >{q}</button>
                ))}
              </div>
            )}
            {askA && (
              <div className="mt-3 p-4 bg-green-50 rounded-xl border border-green-100 anim-in">
                <p className="text-sm text-text-main leading-relaxed">{askA}</p>
              </div>
            )}
          </div>

          {/* ③ Synergy + Algorithm in 2-col */}
          <div className="grid grid-cols-2 gap-4 anim-up" style={{ animationDelay:".4s" }}>
            <div className="bg-gradient-to-br from-primary-light to-green-100 rounded-3xl p-5 border border-green-200">
              <div className="flex items-center gap-2 mb-2">
                <span className="material-symbols-outlined icon-filled text-primary" style={{ fontSize:20 }}>hub</span>
                <p className="font-bold text-primary">Stack Synergy</p>
                <JA><span className="font-heading text-xs text-primary/70">スタックの相乗効果</span></JA>
              </div>
              <p className="text-sm text-text-main leading-relaxed">{result.synergy_en}</p>
              <JA><p className="font-heading text-xs text-text-main/65 mt-2 leading-relaxed">{result.synergy_ja}</p></JA>
            </div>

            <div className="bg-white rounded-3xl p-5 shadow-card">
              <button onClick={() => setAlgoOpen(o=>!o)}
                className="w-full flex items-center justify-between gap-2 text-left"
              >
                <div className="flex items-center gap-2">
                  <span className="material-symbols-outlined text-muted" style={{ fontSize:18 }}>info</span>
                  <p className="font-bold text-text-main text-sm">Why this algorithm?</p>
                  <span className="text-xs text-muted font-normal italic">PM rationale</span>
                </div>
                <span className="material-symbols-outlined text-muted transition-transform" style={{ fontSize:18, transform: algoOpen?"rotate(180deg)":"none" }}>expand_more</span>
              </button>
              {algoOpen && (
                <div className="mt-4 space-y-3.5 anim-in">
                  <div className="p-3 bg-blue-50 rounded-xl border border-blue-100">
                    <div className="flex items-center gap-1.5 mb-1">
                      <span className="w-2 h-2 rounded-full bg-blue-400 shrink-0" />
                      <p className="text-xs font-bold text-blue-700">Content-Based — used at t=0 (new users)</p>
                    </div>
                    <p className="text-xs text-blue-700/80 leading-relaxed">New users have no purchase history. Content-based filtering maps stated goals directly to product attributes — the only viable approach at cold-start. <em>Tradeoff:</em> ignores preferences revealed only through behavior, so match scores are goal-aligned but not preference-tuned.</p>
                  </div>
                  <div className="p-3 bg-purple-50 rounded-xl border border-purple-100">
                    <div className="flex items-center gap-1.5 mb-1">
                      <span className="w-2 h-2 rounded-full bg-purple-400 shrink-0" />
                      <p className="text-xs font-bold text-purple-700">Collaborative — activates after 2+ purchases</p>
                    </div>
                    <p className="text-xs text-purple-700/80 leading-relaxed">Japan-local co-purchase signals surface non-obvious picks — products users with similar profiles discovered but wouldn't have searched. <em>Tradeoff:</em> requires local data volume; risks US-market bias until Japan catalog reaches critical mass (~6 months post-launch).</p>
                  </div>
                  <div className="p-3 bg-primary-light rounded-xl border border-green-200">
                    <div className="flex items-center gap-1.5 mb-1">
                      <span className="w-2 h-2 rounded-full bg-primary shrink-0" />
                      <p className="text-xs font-bold text-primary">Hybrid — target state at scale</p>
                    </div>
                    <p className="text-xs text-text-main/70 leading-relaxed">Weighted ensemble: 60% content / 40% collab for new users, graduating to 30/70 as behavioral data accumulates. Users are graduated automatically when purchase count ≥ 3. <em>Key metric:</em> if collaborative CTR on position-3 rec exceeds 8%, increase collab weight by 10%.</p>
                  </div>
                  <p className="text-xs text-muted italic text-center pt-1">In production: A/B test collab weight weekly against Add-to-Cart rate</p>
                </div>
              )}
            </div>
          </div>
        </div>
      </div>
    );
  }

  // ═══════════════════════════════════════════════════════════════
  //  MODE 2 — CONVERSATIONAL CHAT  (web: chat left + list panel right)
  // ═══════════════════════════════════════════════════════════════
  function ConversationalMode({ apiKey, addToList, added }) {
    const { bilingual } = useLang();

    const OPENER = { role:"assistant", parsed:{
      reply: bilingual
        ? "こんにちは！Hi! I'm your iHerb Japan wellness guide 🌿\n\nI'll help you find the perfect supplements through conversation — no long forms. What health goal brings you here today?\n\n今日の健康目標を教えてください。"
        : "Hi! I'm your iHerb Japan wellness guide 🌿\n\nI'll help you find the perfect supplements through a quick conversation — no forms needed. What health goal brings you here today?",
      recs:null,
    }};

    const MOCK = [
      { reply:"Great goal! Stress + energy are two of the most common reasons our Japan customers visit. Quick question — any dietary restrictions? (vegan, vegetarian, halal, or none?)", recs:null },
      { reply:"Got it. One more: are you currently taking any supplements or medications?\n\nサプリメントやお薬はお飲みですか？", recs:null },
      { reply:"Perfect, I have everything I need. Here are 3 personalized picks for you:", recs:[
        { id:"ashwagandha", matchScore:93, reason:"Proven adaptogen that lowers cortisol — ideal for your stress goal.", tag:"🧘 Stress" },
        { id:"b-complex",   matchScore:87, reason:"B vitamins fuel cellular energy — great for afternoon slumps.",       tag:"⚡ Energy" },
        { id:"magnesium",   matchScore:82, reason:"Supports both stress regulation and sleep — a two-for-one.",         tag:"😴 Recovery" },
      ]},
    ];

    const [messages, setMessages] = useState([OPENER]);
    const [input,    setInput]    = useState("");
    const [loading,  setLoading]  = useState(false);
    const [error,    setError]    = useState("");
    const [mockIdx,  setMockIdx]  = useState(0);
    const bottomRef = useRef(null);

    useEffect(() => { bottomRef.current?.scrollIntoView({ behavior:"smooth" }); }, [messages, loading]);

    const send = async () => {
      const text = input.trim();
      if (!text||loading) return;
      setInput(""); setError("");
      const next = [...messages, { role:"user", content:text }];
      setMessages(next); setLoading(true);
      try {
        let parsed;
        if (!apiKey) {
          await new Promise(r=>setTimeout(r,1100));
          parsed = MOCK[Math.min(mockIdx, MOCK.length-1)];
          setMockIdx(i=>i+1);
        } else {
          const apiMsgs = next
            .filter(m=>m.role==="user"||(m.role==="assistant"&&m.parsed))
            .map(m=>({ role:m.role, content:m.role==="assistant"?m.parsed.reply:m.content }));
          const firstUser = apiMsgs.findIndex(m=>m.role==="user");
          parsed = await fetchConversationalReply(apiKey, firstUser>=0?apiMsgs.slice(firstUser):apiMsgs, bilingual);
        }
        setMessages(prev=>[...prev,{ role:"assistant", parsed }]);
      } catch { setError("Something went wrong — please try again."); }
      finally { setLoading(false); }
    };

    const renderRecs = recs => (
      <div className="mt-3 space-y-2">
        <p className="text-xs font-bold text-primary">✦ Personalized recommendations</p>
        {recs.map((rec,i) => {
          const p = JAPAN_CATALOG.find(x=>x.id===rec.id);
          return (
            <div key={i} className="bg-primary-light rounded-xl p-3 flex items-center gap-2">
              {p && <div className="w-8 h-8 rounded-lg flex items-center justify-center shrink-0" style={{ background:p.bg }}>
                <span className="material-symbols-outlined icon-filled text-primary" style={{ fontSize:16 }}>{p.icon}</span>
              </div>}
              <div className="flex-1 min-w-0">
                <p className="text-xs font-bold text-text-main truncate">{p?.name||rec.id}</p>
                <p className="text-xs text-muted leading-tight">{rec.reason}</p>
              </div>
              <div className="flex items-center gap-1.5 shrink-0">
                <span className="text-xs font-black text-primary">{rec.matchScore}%</span>
                <button onClick={() => addToList(rec)}
                  className={`text-xs px-2 py-1 rounded-lg font-bold transition-all ${added[rec.id]?"bg-primary text-white":"bg-white text-primary border border-primary hover:bg-primary-light"}`}
                >{added[rec.id]?"✓":"+"}</button>
              </div>
            </div>
          );
        })}
      </div>
    );

    return (
      <div className="flex" style={{ height:"calc(100vh - 0px)" }}>

        {/* Chat column */}
        <div className="flex-1 flex flex-col min-w-0">
          <div className="flex-1 overflow-y-auto px-8 py-6 space-y-4 max-w-3xl">
            {messages.map((msg,i) => (
              <div key={i} className={`flex gap-3 ${msg.role==="user"?"flex-row-reverse anim-r":"anim-l"}`}>
                {msg.role==="assistant" && (
                  <div className="w-9 h-9 bg-primary rounded-full flex items-center justify-center shrink-0 mt-1 shadow-card">
                    <span className="text-white text-xs font-black">iH</span>
                  </div>
                )}
                <div className={`max-w-[75%] rounded-2xl px-4 py-3 text-sm leading-relaxed ${
                  msg.role==="assistant" ? "bg-white shadow-card text-text-main" : "bg-primary text-white"
                }`}>
                  <p className="whitespace-pre-line">{msg.role==="assistant"?msg.parsed.reply:msg.content}</p>
                  {msg.role==="assistant"&&msg.parsed.recs&&renderRecs(msg.parsed.recs)}
                </div>
              </div>
            ))}
            {loading && (
              <div className="flex gap-3 anim-l">
                <div className="w-9 h-9 bg-primary rounded-full flex items-center justify-center shrink-0 shadow-card">
                  <span className="text-white text-xs font-black">iH</span>
                </div>
                <div className="bg-white shadow-card rounded-2xl px-4 py-3 flex gap-1.5 items-center">
                  <span className="dot"/><span className="dot"/><span className="dot"/>
                </div>
              </div>
            )}
            {error && <p className="text-center text-xs text-accent">{error}</p>}
            <div ref={bottomRef}/>
          </div>

          {/* Input bar */}
          <div className="px-8 py-4 bg-white border-t border-green-100 flex gap-3 max-w-3xl">
            <input value={input} onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&send()}
              placeholder="Type your message..."
              className="flex-1 border border-green-200 rounded-xl px-4 py-3 text-sm focus:border-primary transition-colors"
            />
            <button onClick={send} disabled={loading||!input.trim()}
              className="bg-primary text-white px-5 py-3 rounded-xl font-bold disabled:opacity-50 active:scale-95 transition-all"
            >{loading?<span className="spinner"/>:"→"}</button>
            <button onClick={() => { setMessages([OPENER]); setInput(""); setMockIdx(0); }}
              className="border border-green-200 text-muted px-3 py-3 rounded-xl hover:border-primary hover:text-primary transition-colors"
              title="Start over"
            >↺</button>
          </div>
        </div>
      </div>
    );
  }

  // ═══════════════════════════════════════════════════════════════
  //  MODE 3 — PROFILE  (web: 2-col form + recs)
  // ═══════════════════════════════════════════════════════════════
  function ProfileMode({ apiKey, prefillGoals, addToList, added }) {
    const { bilingual } = useLang();
    const [profile, setProfile] = useState({
      age:"", goals:prefillGoals?.length?[...prefillGoals]:[], diet:"no-restriction", notes:"",
    });
    const [recs,      setRecs]      = useState(null);
    const [loading,   setLoading]   = useState(false);
    const [error,     setError]     = useState("");
    const [strategy,  setStrategy]  = useState("hybrid");
    const [askQ,      setAskQ]      = useState("");
    const [askA,      setAskA]      = useState("");
    const [askLoading,setAskLoading]= useState(false);

    const MOCK = { recs:[
      { id:"vitamin-d3",  matchScore:94, reason:"Vitamin D3 is foundational for immunity — commonly deficient in Japan due to limited sun.",       strategy:"content-based", confidence:91 },
      { id:"omega3",      matchScore:89, reason:"Omega-3 supports cognitive focus and is a top-seller among Japan users in your profile group.",    strategy:"collaborative",  confidence:85 },
      { id:"ashwagandha", matchScore:84, reason:"Ashwagandha lowers cortisol and provides sustained energy — zero jitteriness.",                   strategy:"hybrid",         confidence:80 },
      { id:"gold-c",      matchScore:78, reason:"Vitamin C is a foundational antioxidant that strengthens your other picks.",                       strategy:"content-based",  confidence:74 },
    ]};

    const toggleGoal = id => setProfile(prev => ({
      ...prev, goals: prev.goals.includes(id)?prev.goals.filter(g=>g!==id):prev.goals.length<4?[...prev.goals,id]:prev.goals,
    }));

    const getRecs = async () => {
      if (!profile.goals.length) return;
      setLoading(true); setError(""); setRecs(null);
      try {
        const result = apiKey
          ? await fetchProfileRecs(apiKey, { ...profile, goals:profile.goals.join(", ") })
          : (await new Promise(r=>setTimeout(r,1500)), MOCK);
        setRecs(result);
      } catch(e) { setError(e.message||"Failed to get recommendations."); }
      finally { setLoading(false); }
    };

    const handleAsk = async () => {
      if (!askQ.trim()) return;
      setAskLoading(true); setAskA("");
      try {
        const ctx = recs
          ? `Goals: ${profile.goals.join(", ")}. Recs: ${recs.recs.map(r=>JAPAN_CATALOG.find(p=>p.id===r.id)?.name||r.id).join(", ")}.`
          : `Goals: ${profile.goals.join(", ")}.`;
        setAskA(apiKey ? await fetchAskAnything(apiKey,askQ,ctx,bilingual) : "Add your Anthropic API key to enable AI answers.");
      } catch { setAskA("Sorry — something went wrong."); }
      finally { setAskLoading(false); }
    };

    return (
      <div className="flex gap-0 min-h-screen">

        {/* LEFT — form */}
        <div className="w-80 shrink-0 border-r border-green-100 bg-white overflow-y-auto">
          <div className="p-6">
            <h3 className="font-display font-bold text-text-main text-base flex items-center gap-2 mb-5">
              <span className="material-symbols-outlined icon-filled text-primary" style={{ fontSize:20 }}>manage_accounts</span>
              My Profile
              <JA><span className="font-heading text-xs text-muted font-normal">プロフィール</span></JA>
              {prefillGoals?.length>0 && <span className="ml-auto text-xs text-primary bg-primary-light px-2 py-0.5 rounded-full border border-green-200">Quiz ✓</span>}
            </h3>

            {/* Age */}
            <label className="block text-xs font-bold text-muted uppercase tracking-wide mb-1.5">
              Age <JA><span className="font-heading normal-case text-muted font-normal">年齢</span></JA>
            </label>
            <input type="number" value={profile.age} min="1" max="120"
              onChange={e=>setProfile(p=>({...p,age:e.target.value}))}
              placeholder="e.g. 28"
              className="border border-green-200 rounded-xl px-3 py-2 text-sm w-32 mb-4 focus:border-primary transition-colors"
            />

            {/* Goals */}
            <label className="block text-xs font-bold text-muted uppercase tracking-wide mb-2">
              Health Goals <JA><span className="font-heading normal-case font-normal">健康目標</span></JA>
            </label>
            <div className="grid grid-cols-4 gap-1.5 mb-4">
              {GOAL_OPTIONS.map(g => {
                const sel = profile.goals.includes(g.id);
                return (
                  <button key={g.id} onClick={() => toggleGoal(g.id)}
                    className={`p-2 rounded-xl text-center transition-all ${sel?"bg-primary-light border border-primary":"bg-green-50 border border-transparent hover:border-green-200"}`}
                  >
                    <span className={`material-symbols-outlined ${sel?"icon-filled text-primary":"text-muted"}`} style={{ fontSize:18 }}>{g.icon}</span>
                    <p className={`text-xs font-semibold mt-0.5 ${sel?"text-primary":"text-muted"}`}>{g.label}</p>
                  </button>
                );
              })}
            </div>

            {/* Diet */}
            <label className="block text-xs font-bold text-muted uppercase tracking-wide mb-2">
              Diet <JA><span className="font-heading normal-case font-normal">食事制限</span></JA>
            </label>
            <div className="flex flex-wrap gap-1.5 mb-4">
              {DIET_OPTIONS.map(d => (
                <button key={d.id} onClick={() => setProfile(p=>({...p,diet:d.id}))}
                  className={`text-xs px-3 py-1.5 rounded-full font-bold transition-all ${profile.diet===d.id?"bg-primary text-white":"bg-green-50 text-muted hover:bg-green-100"}`}
                >{d.label}</button>
              ))}
            </div>

            {/* Notes */}
            <label className="block text-xs font-bold text-muted uppercase tracking-wide mb-1.5">
              Notes <JA><span className="font-heading normal-case font-normal">メモ</span></JA>
            </label>
            <input value={profile.notes} onChange={e=>setProfile(p=>({...p,notes:e.target.value}))}
              placeholder="Allergies, medications..."
              className="w-full border border-green-200 rounded-xl px-3 py-2 text-sm mb-4 focus:border-primary transition-colors"
            />

            {/* Algorithm */}
            <label className="block text-xs font-bold text-muted uppercase tracking-wide mb-2">Algorithm</label>
            <div className="flex gap-1.5 mb-1.5">
              {["hybrid","content-based","collaborative"].map(s => (
                <button key={s} onClick={() => setStrategy(s)}
                  className={`flex-1 text-xs py-2 rounded-xl font-bold transition-all ${strategy===s?"bg-primary text-white":"bg-green-50 text-muted hover:bg-green-100"}`}
                >{s==="hybrid"?"Hybrid":s==="content-based"?"Content":"Collab."}</button>
              ))}
            </div>
            <p className="text-xs text-muted mb-5">
              {strategy==="hybrid"&&"Blend of profile match + similar user signals"}
              {strategy==="content-based"&&"Matches purely on stated goals & dietary needs"}
              {strategy==="collaborative"&&"Based on purchases from similar user profiles"}
            </p>

            <button onClick={getRecs} disabled={loading||!profile.goals.length}
              className={`w-full py-3.5 rounded-2xl font-bold text-sm transition-all ${
                profile.goals.length?"bg-primary text-white shadow-soft hover:bg-primary-dark active:scale-95":"bg-green-100 text-muted cursor-not-allowed"
              }`}
            >
              {loading
                ? <span className="flex items-center justify-center gap-2"><span className="spinner"/>Finding recommendations...</span>
                : <>Get Recommendations <JA><span className="block font-heading font-normal text-xs opacity-75 mt-0.5">おすすめを見る</span></JA></>
              }
            </button>
            {error && <p className="text-xs text-accent text-center mt-2">{error}</p>}
          </div>
        </div>

        {/* RIGHT — recs */}
        <div className="flex-1 overflow-y-auto p-8">
          {!recs && !loading && (
            <div className="flex flex-col items-center justify-center h-full text-center max-w-sm mx-auto">
              <div className="w-20 h-20 bg-primary-light rounded-full flex items-center justify-center mb-5">
                <span className="material-symbols-outlined icon-filled text-primary" style={{ fontSize:36 }}>auto_awesome</span>
              </div>
              <h3 className="font-display font-bold text-text-main text-xl mb-2">Your recommendations will appear here</h3>
              <JA><p className="font-heading text-sm text-muted mb-2">おすすめがここに表示されます</p></JA>
              <p className="text-sm text-muted">Fill in your profile on the left and click <strong>Get Recommendations</strong> to see your personalized supplement stack.</p>
            </div>
          )}

          {recs && (
            <div className="max-w-3xl anim-up">
              <h3 className="font-display font-bold text-text-main text-xl mb-5">
                Your Recommendations
                <JA><span className="font-heading text-sm text-muted font-normal ml-2">あなたへのおすすめ</span></JA>
              </h3>

              {/* 2-col recs grid */}
              <div className="grid grid-cols-2 gap-4 mb-6">
                {recs.recs.map((rec,i) => {
                  const prod = JAPAN_CATALOG.find(p=>p.id===rec.id);
                  if (!prod) return null;
                  return (
                    <div key={i} className="bg-white rounded-2xl shadow-card p-4 flex items-start gap-3">
                      <div className="w-11 h-11 rounded-xl flex items-center justify-center shrink-0" style={{ background:prod.bg }}>
                        <span className="material-symbols-outlined icon-filled text-primary" style={{ fontSize:22 }}>{prod.icon}</span>
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="flex items-start justify-between gap-2">
                          <div className="min-w-0">
                            <p className="text-xs text-muted">{prod.brand}</p>
                            <p className="font-bold text-sm text-text-main leading-snug">{prod.name}</p>
                            <p className="text-primary font-bold text-sm">{prod.price}</p>
                          </div>
                          <div className="text-right shrink-0">
                            <p className="text-xl font-black text-primary leading-none">{rec.matchScore}%</p>
                            <p className="text-xs text-muted">match</p>
                          </div>
                        </div>
                        <p className="text-xs text-muted mt-1.5 leading-relaxed">{rec.reason}</p>
                        <div className="flex gap-1.5 mt-2 flex-wrap items-center">
                          <span className="text-xs bg-blue-50 text-blue-600 px-2 py-0.5 rounded-full border border-blue-100">{STRATEGY_LABEL[rec.strategy]||rec.strategy}</span>
                          <span className="text-xs bg-green-50 text-primary px-2 py-0.5 rounded-full border border-green-100">Conf: {rec.confidence}%</span>
                          <button onClick={() => addToList(rec)}
                            className={`ml-auto text-xs px-2.5 py-1 rounded-lg font-bold transition-all ${added[rec.id]?"bg-primary text-white":"bg-white text-primary border border-primary hover:bg-primary-light"}`}
                          >{added[rec.id] ? "✓ Added" : "+ Add to List"}</button>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* Ask Anything */}
              <div className="bg-white rounded-2xl shadow-card p-5">
                <p className="font-bold text-text-main flex items-center gap-2 mb-3">
                  <span className="material-symbols-outlined icon-filled text-primary" style={{ fontSize:20 }}>chat</span>
                  Ask Anything
                  <JA><span className="font-heading text-sm text-muted font-normal">何でも聞く</span></JA>
                </p>
                <div className="flex gap-2 mb-2">
                  <input value={askQ} onChange={e=>setAskQ(e.target.value)}
                    onKeyDown={e=>e.key==="Enter"&&handleAsk()}
                    placeholder="Ask about your recommendations..."
                    className="flex-1 border border-green-200 rounded-xl px-3 py-2.5 text-sm focus:border-primary transition-colors"
                  />
                  <button onClick={handleAsk} disabled={askLoading||!askQ.trim()}
                    className="bg-primary text-white px-5 py-2.5 rounded-xl font-bold text-sm disabled:opacity-50 active:scale-95 transition-all"
                  >{askLoading?<span className="spinner"/>:"Ask →"}</button>
                </div>
                {!askA && (
                  <div className="flex flex-wrap gap-2">
                    {["Can I take all 4 together?","Which is most important?","Morning or evening?"].map(q => (
                      <button key={q} onClick={() => setAskQ(q)} className="text-xs bg-green-50 text-primary px-3 py-1.5 rounded-full hover:bg-primary-light border border-green-100 transition-colors">{q}</button>
                    ))}
                  </div>
                )}
                {askA && (
                  <div className="mt-2 p-4 bg-green-50 rounded-xl border border-green-100 anim-in">
                    <p className="text-sm text-text-main leading-relaxed">{askA}</p>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      </div>
    );
  }

  // ═══════════════════════════════════════════════════════════════
  //  APP SHELL
  // ═══════════════════════════════════════════════════════════════
  function AppShell() {
    const [apiKey,    setApiKey]    = useState(USE_PROXY ? "proxy" : "");
    const [bilingual, setBilingual] = useState(true);
    const [onboardingGoals, setOGoals] = useState([]);
    const [shopList,  setShopList]  = useState([]);
    const [added,     setAdded]     = useState({});
    const [listOpen,  setListOpen]  = useState(false);
    const navigate = useNavigate();
    const location = useLocation();

    const addToList = item => {
      if (added[item.id]) return;
      const prod = JAPAN_CATALOG.find(p => p.id === item.id) || {};
      setShopList(prev => [...prev, { ...prod, ...item }]);
      setAdded(prev => ({ ...prev, [item.id]: true }));
      setListOpen(true);
    };

    const removeFromList = id => {
      setShopList(prev => prev.filter(p => p.id !== id));
      setAdded(prev => { const n = { ...prev }; delete n[id]; return n; });
    };

    const onProductPages = ["/results", "/chat", "/profile"].some(p => location.pathname.startsWith(p));

    const activeMode = location.pathname.startsWith("/chat")    ? "chat"
                     : location.pathname.startsWith("/profile") ? "profile"
                     : "onboarding";

    const handleMode = mode => {
      if (mode === "onboarding") navigate("/");
      else if (mode === "chat")  navigate("/chat");
      else                       navigate("/profile");
    };

    useEffect(() => {
      if (location.pathname === "/results" && location.state?.goals?.length) {
        setOGoals(location.state.goals);
      }
    }, [location]);

    return (
      <LangCtx.Provider value={{ bilingual }}>
        <Sidebar
          activeMode={activeMode}
          onMode={handleMode}
          bilingual={bilingual}
          onLang={setBilingual}
          apiKey={apiKey}
          onApiKey={setApiKey}
        />
        <main style={{ marginLeft:224 }} className="min-h-screen bg-bg overflow-x-hidden">
          <Routes>
            <Route path="/"         element={<WelcomeScreen />} />
            <Route path="/intake"   element={<IntakeScreen />} />
            <Route path="/thinking" element={<ThinkingScreen apiKey={apiKey} />} />
            <Route path="/results"  element={<ResultsScreen apiKey={apiKey} addToList={addToList} added={added} />} />
            <Route path="/chat"     element={<ConversationalMode apiKey={apiKey} addToList={addToList} added={added} />} />
            <Route path="/profile"  element={<ProfileMode apiKey={apiKey} prefillGoals={onboardingGoals} addToList={addToList} added={added} />} />
          </Routes>
        </main>

        {/* Floating My List panel — opens when user adds a product */}
        {listOpen && onProductPages && (
          <MyListPanel shopList={shopList} onRemove={removeFromList} onClose={() => setListOpen(false)} />
        )}

        {/* Floating reopen badge — shows when panel is closed but list has items */}
        {!listOpen && onProductPages && shopList.length > 0 && (
          <button onClick={() => setListOpen(true)}
            style={{ bottom:24, right:24 }}
            className="fixed flex items-center gap-2 bg-primary text-white px-4 py-2.5 rounded-2xl shadow-soft hover:bg-primary-dark transition-all anim-up"
          >
            <span className="material-symbols-outlined icon-filled" style={{ fontSize:18 }}>shopping_bag</span>
            <span className="text-sm font-bold">My List</span>
            <span className="bg-white text-primary text-xs font-black w-5 h-5 rounded-full flex items-center justify-center">{shopList.length}</span>
          </button>
        )}
      </LangCtx.Provider>
    );
  }

  function App() {
    return <MemoryRouter><AppShell /></MemoryRouter>;
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
